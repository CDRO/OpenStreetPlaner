# Deployment auf Deploio (nine.ch PaaS): jede veröffentlichte GitHub-Release (Tag auf main)
# wird als Revision an die Deploio-App übergeben; Deploio baut das Dockerfile und rollt aus.
# Manuell über „Run workflow“ mit beliebiger Revision (Tag, Branch oder Commit), und aus
# release.yml heraus, wenn ein Commit „Release vX.Y.Z“ auf main getaggt wurde.
#
# Voraussetzungen (einmalig, siehe README „Deployment auf Deploio“):
#   Secrets:   NCTL_API_CLIENT_ID, NCTL_API_CLIENT_SECRET, NCTL_ORGANIZATION
#   Variablen: DEPLOIO_PROJECT (Standard <org>-openstreetplaner), DEPLOIO_APP (Standard main),
#              VAPID_SUBJECT (z. B. mailto:…, nur beim Anlegen der App verwendet)
#   Bucket:    Variablen S3_BUCKET, S3_ENDPOINT, optional S3_PREFIX; Secrets S3_ACCESS_KEY, S3_SECRET_KEY
#              (dauerhafte Ablage der Entwürfe; ohne Bucket bleibt sie flüchtig)
#   E-Mail:    Variablen SMTP_HOST, SMTP_PORT, SMTP_FROM, PUBLIC_URL, optional RETENTION_DAYS;
#              Secrets SMTP_USER, SMTP_PASSWORD (Erinnerung zur Sicherung vor dem Löschen alter Entwürfe)
# Beim ersten Lauf legt der Workflow die App an (Docker-Build, Port 8080, Health-Probe /healthz).
name: Deploy to Deploio

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      revision:
        description: "Git-Revision (Tag, Branch oder Commit)"
        required: false
        default: "main"
  # Aufruf aus release.yml: Tags und Releases, die eine Action mit GITHUB_TOKEN anlegt, lösen
  # kein release-Ereignis aus – darum ruft der Release-Workflow den Deploy direkt auf.
  workflow_call:
    inputs:
      revision:
        description: "Git-Revision (Tag), die ausgerollt wird"
        required: true
        type: string

concurrency:
  group: deploio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NCTL_API_CLIENT_ID: ${{ secrets.NCTL_API_CLIENT_ID }}
      NCTL_API_CLIENT_SECRET: ${{ secrets.NCTL_API_CLIENT_SECRET }}
      NCTL_ORGANIZATION: ${{ secrets.NCTL_ORGANIZATION }}
      DEPLOIO_PROJECT: ${{ vars.DEPLOIO_PROJECT }}
      DEPLOIO_APP: ${{ vars.DEPLOIO_APP }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      S3_PREFIX: ${{ vars.S3_PREFIX }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      RETENTION_DAYS: ${{ vars.RETENTION_DAYS }}
      REVISION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.revision }}
    steps:
      - name: Install nctl
        run: |
          echo "deb [trusted=yes] https://repo.nine.ch/deb/ /" | sudo tee /etc/apt/sources.list.d/repo.nine.ch.list
          sudo apt-get update -qq
          sudo apt-get install -y nctl
          nctl --version

      - name: Authenticate
        run: |
          test -n "$NCTL_API_CLIENT_ID" && test -n "$NCTL_API_CLIENT_SECRET" && test -n "$NCTL_ORGANIZATION" \
            || { echo "Secrets NCTL_API_CLIENT_ID, NCTL_API_CLIENT_SECRET, NCTL_ORGANIZATION fehlen."; exit 1; }
          nctl auth login
          PROJECT="${DEPLOIO_PROJECT:-${NCTL_ORGANIZATION}-openstreetplaner}"
          APP="${DEPLOIO_APP:-main}"
          nctl auth set-project "$PROJECT" --force
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Projekt $PROJECT, App $APP, Revision $REVISION"

      - name: Create app on first run, otherwise set the new revision
        run: |
          # nctl-Fehler als Annotation am Check zeigen (das Log-Archiv ist nicht überall erreichbar)
          run_nctl() {
            local out
            if ! out=$(nctl "$@" 2>&1); then
              printf '%s\n' "$out"
              hint=""
              if [ "$1" = "create" ]; then hint=" – Falls das Projekt fehlt: Variable DEPLOIO_PROJECT auf den echten Projektnamen setzen (nctl auth whoami) oder 'nctl create project $PROJECT' ausführen."; fi
              echo "::error title=nctl $1 $2 fehlgeschlagen::$(printf '%s' "$out" | tail -n 15 | tr '\n' ' ' | cut -c1-800)$hint"
              return 1
            fi
            printf '%s\n' "$out"
          }
          # Bucket-Variablen (falls hinterlegt) bei jedem Lauf angleichen; Schlüssel als sensitive env, je ein Flag
          BUCKET_FLAGS=()
          if [ -n "$S3_BUCKET" ] && [ -n "$S3_ENDPOINT" ] && [ -n "$S3_ACCESS_KEY" ] && [ -n "$S3_SECRET_KEY" ]; then
            BUCKET_FLAGS+=("--env=S3_BUCKET=${S3_BUCKET}" "--env=S3_ENDPOINT=${S3_ENDPOINT}")
            if [ -n "$S3_PREFIX" ]; then BUCKET_FLAGS+=("--env=S3_PREFIX=${S3_PREFIX}"); fi
            BUCKET_FLAGS+=("--sensitive-env=S3_ACCESS_KEY=${S3_ACCESS_KEY}" "--sensitive-env=S3_SECRET_KEY=${S3_SECRET_KEY}")
            echo "Ablage: Bucket $S3_BUCKET ($S3_ENDPOINT)"
          else
            echo "Hinweis: kein Bucket konfiguriert – Entwürfe liegen auf flüchtigem Speicher."
          fi
          # E-Mail-Erinnerungen (falls hinterlegt): SMTP-Zugang als sensitive env, Rest als env
          MAIL_FLAGS=()
          if [ -n "$SMTP_HOST" ]; then
            MAIL_FLAGS+=("--env=SMTP_HOST=${SMTP_HOST}")
            if [ -n "$SMTP_PORT" ]; then MAIL_FLAGS+=("--env=SMTP_PORT=${SMTP_PORT}"); fi
            if [ -n "$SMTP_FROM" ]; then MAIL_FLAGS+=("--env=SMTP_FROM=${SMTP_FROM}"); fi
            if [ -n "$SMTP_USER" ]; then MAIL_FLAGS+=("--sensitive-env=SMTP_USER=${SMTP_USER}"); fi
            if [ -n "$SMTP_PASSWORD" ]; then MAIL_FLAGS+=("--sensitive-env=SMTP_PASSWORD=${SMTP_PASSWORD}"); fi
            echo "E-Mail: Erinnerungen über $SMTP_HOST"
          else
            echo "Hinweis: kein SMTP_HOST konfiguriert – alte Entwürfe werden ohne Erinnerung gelöscht."
          fi
          if [ -n "$PUBLIC_URL" ]; then MAIL_FLAGS+=("--env=PUBLIC_URL=${PUBLIC_URL}"); fi
          if [ -n "$RETENTION_DAYS" ]; then MAIL_FLAGS+=("--env=RETENTION_DAYS=${RETENTION_DAYS}"); fi
          # Stand vor der Änderung merken, damit der Warte-Schritt den neuen Build und das neue Release erkennt
          one() { jq -r 'if type=="array" then .[0] else . end | '"$1"' // ""'; }
          if nctl get app "$APP" >/dev/null 2>&1; then
            echo "BEFORE_BUILD=$(nctl get app "$APP" -o json | one .status.atProvider.latestBuild)" >> "$GITHUB_ENV"
            echo "BEFORE_RELEASE=$(nctl get app "$APP" -o json | one .status.atProvider.latestRelease)" >> "$GITHUB_ENV"
            # --skip-repo-access-check: ohne neue Zugangsdaten liest nctl beim Update sonst ein Auth-Secret
            # mit dem App-Namen, das es für ein öffentliches Repo nicht gibt („secrets \"main\" not found“)
            run_nctl update app "$APP" --git-revision="$REVISION" --skip-repo-access-check "${BUCKET_FLAGS[@]}" "${MAIL_FLAGS[@]}"
          else
            echo "BEFORE_BUILD=" >> "$GITHUB_ENV"
            echo "BEFORE_RELEASE=" >> "$GITHUB_ENV"
            ENV_FLAGS=(--env=TRUST_PROXY=1 "--env=USER_AGENT=Stadtplaner/1.0 (+https://github.com/${GITHUB_REPOSITORY})")
            if [ -n "$VAPID_SUBJECT" ]; then ENV_FLAGS+=("--env=VAPID_SUBJECT=${VAPID_SUBJECT}"); fi
            run_nctl create app "$APP" \
              --git-url="https://github.com/${GITHUB_REPOSITORY}.git" \
              --git-revision="$REVISION" \
              --dockerfile \
              --port=8080 \
              --size=micro \
              --health-probe-path=/healthz \
              "${ENV_FLAGS[@]}" "${BUCKET_FLAGS[@]}" "${MAIL_FLAGS[@]}"
          fi

      - name: Wait for build and release
        run: |
          # Deploio baut zuerst (Build: running -> success|error|imageUploadFailed) und rollt dann aus
          # (Release: progressing -> available|failure|replicaFailure). Die App nennt in
          # status.atProvider.latestBuild / latestRelease die jeweils neuesten Namen.
          one() { jq -r 'if type=="array" then .[0] else . end | '"$1"' // ""'; }
          RSTAT=""
          for i in $(seq 1 60); do
            APPJSON=$(nctl get app "$APP" -o json)
            BUILD=$(echo "$APPJSON" | one .status.atProvider.latestBuild)
            REL=$(echo "$APPJSON" | one .status.atProvider.latestRelease)
            BSTAT=""; RSTAT=""
            [ -n "$BUILD" ] && BSTAT=$(nctl get build "$BUILD" -o json | one .status.atProvider.buildStatus)
            [ -n "$REL" ] && RSTAT=$(nctl get release "$REL" -o json | one .status.atProvider.releaseStatus)
            echo "  Build ${BUILD:-?}: ${BSTAT:-?} · Release ${REL:-?}: ${RSTAT:-?} ($i/60)"
            if [ -n "$BUILD" ] && [ "$BUILD" != "$BEFORE_BUILD" ]; then
              case "$BSTAT" in
                error|imageUploadFailed) echo "Build fehlgeschlagen:"; nctl logs build -a "$APP" 2>/dev/null | tail -80; exit 1 ;;
              esac
            fi
            if [ -n "$REL" ] && [ "$REL" != "$BEFORE_RELEASE" ]; then
              case "$RSTAT" in
                available) echo "Release $REL läuft."; break ;;
                failure|replicaFailure) echo "Release fehlgeschlagen:"; nctl logs app "$APP" --type app --since 15m 2>/dev/null | tail -80; exit 1 ;;
              esac
            elif [ "$i" -ge 8 ] && [ "$BUILD" = "$BEFORE_BUILD" ] && [ "$RSTAT" = "available" ]; then
              # Nach zwei Minuten kein neuer Build: Revision war schon ausgerollt
              echo "Keine neue Version – Revision $REVISION läuft bereits (Release $REL)."; break
            fi
            sleep 15
          done
          [ "$RSTAT" = "available" ] || { echo "Zeitüberschreitung (15 min) – Stand: Build ${BSTAT:-?}, Release ${RSTAT:-?}."; exit 1; }
          nctl get releases -a "$APP" 2>/dev/null | head -5 || true
          nctl get app "$APP"
