name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/stadtplaner .

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests (Frontend, ohne Abhängigkeiten)
        run: node --test web/tests/*.test.mjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t stadtplaner:ci .
      - name: smoke
        run: |
          docker run -d --name sp -p 8080:8080 stadtplaner:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break || sleep 1; done
          curl -fs http://localhost:8080/ | grep -q Stadtplaner
          docker rm -f sp
